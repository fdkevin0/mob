# Default: XDG_CONFIG_HOME/mob/config.yaml (platform defaults from adrg/xdg).
# CLI flags > MOB_* environment > this file > defaults.
addr: 127.0.0.1:8787

# Offline model simulation; changing it requires a restart.
demo: false

# Model calls one turn may make while it uses tools (1-100). A turn that
# reaches it stops and asks you to send another message. Reloads live.
# max_tool_steps: 20

# The public web UI mob open --web signs in. Mob lets this origin call its API
# with your token; an empty value turns it off. Reloads live.
# web_url: https://mob.fdkevin.cloud

# Model providers and their keys are not configured here. They live in
# providers.json in this directory (owner-only, 0600), managed with:
#   mob provider add deepseek --key-stdin
#   mob provider ls
# and chosen per conversation with /model and /models.

# Optional startup-only directory overrides:
# data_dir: /absolute/path/to/mob-data
# state_dir: /absolute/path/to/mob-state

# Let the model run any command in a throwaway container. Only
# data_dir/sandbox/<conversation> is shared, at /workspace. Reloads live.
# sandbox:
#   enabled: true
#   runtime: ""            # containerd (Linux, via nerdctl), apple (macOS), wslc (Windows)
#   image: python:3.13-slim
#   network: ""            # none: no network at all; empty: the runtime's default (internet)
#   cpus: 0                # whole CPUs per command; 0: the runtime's default
#   memory: ""             # e.g. 512m or 2g, at least 64m; empty: the runtime's default
#   isolation: ""          # gvisor: run under gVisor's runsc (Linux, containerd only); empty: the runtime's own

# MCP servers whose tools the model may use, each call after your approval.
# A command is started by Mob (outside the sandbox, as you) and inherits its
# environment without MOB_* variables; a url is a Streamable HTTP endpoint.
# Server names use a-z, 0-9, - and _. Keep this file chmod 600 if it holds
# keys. Reloads live; /mcp shows status and tools.
# mcp_servers:
#   github:
#     command: npx
#     args: [-y, "@modelcontextprotocol/server-github"]
#     env: [GITHUB_PERSONAL_ACCESS_TOKEN=...]
#     # Tools wait until tool_search loads them; direct declares them every turn.
#     tool_exposure: {"delete_*": hidden}
#   docs:
#     url: https://example.com/mcp
#     headers:
#       Authorization: Bearer ...

# Full flag/env/default reference: docs/environment-variables.md (generated).
# Optional fixed local token; otherwise Mob manages the token file. Keep this
# config owner-only (chmod 600) when token fields are present.
# token: ""
# gateway:
#   url: ""               # register this service with a gateway
#   node_id: ""           # empty uses hostname
#   addr: ":8788"         # mob gateway listen address
#   token: ""             # separate from the local token
