# Default: XDG_CONFIG_HOME/mob/config.yaml (platform defaults from adrg/xdg).
# CLI flags > MOB_* environment > this file > defaults.
addr: 127.0.0.1:8787

# Default AI provider: OpenCode Zen Free (works out-of-the-box with anonymous public token).
base_url: https://opencode.ai/zen/v1
model: mimo-v2.6-flash-free
# Omit api_key to use a saved Zen key, or the public fallback for this free model.
demo: false

# To use other providers, override base_url, model, and api_key:
#
# DeepSeek:
#   base_url: https://api.deepseek.com
#   model: deepseek-chat
#   api_key: "sk-your-deepseek-key"
#
# OpenAI:
#   base_url: https://api.openai.com/v1
#   model: gpt-4o-mini
#   api_key: "sk-your-openai-key"
#
# Local Ollama:
#   base_url: http://localhost:11434/v1
#   model: llama3.2
#   api_key: "ollama"

# Optional startup-only directory overrides:
# data_dir: /absolute/path/to/mob-data
# state_dir: /absolute/path/to/mob-state

# Prefer MOB_API_KEY (or DEEPSEEK_API_KEY) for environment credentials.
# If api_key is present in config.yaml, the file must be owner-readable only: chmod 600.
# An explicit empty api_key disables the saved database key; omitting it uses
# the saved key only for the API origin where it was entered.
