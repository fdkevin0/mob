name: PR title

# Pull requests are squash-merged with their title as the commit message, and
# release-please builds the changelog and next version from those messages
# (CONTRIBUTING.md), so the title must be a conventional commit header.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|revert|refactor|docs|test|ci|chore|build|style)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "OK: $TITLE"
            exit 0
          fi
          echo "::error::The title must look like 'type(scope): description', e.g. 'fix(models): close reload race'. Types: feat, fix, perf, revert, refactor, docs, test, ci, chore, build, style; add '!' before ':' for a breaking change."
          exit 1
