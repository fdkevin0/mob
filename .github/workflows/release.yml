name: Release

# Every change to main arrives by pull request. Once CI passes on a commit pushed
# to main (docs/features/releases.md):
# - nightly: the commit is published as a prerelease tagged {date}.{sha};
# - stable: release-please keeps a release PR with the next vX.Y.Z and its
#   changelog up to date. When that PR is merged it tags the release, and
#   GoReleaser adds the archives and updates the Homebrew cask.
# Older releases stay downloadable for database upgrades (docs/features/releases.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  nightly:
    name: Publish nightly
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: nightly-${{ github.event.workflow_run.head_sha }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Build the web UI
        run: bun run build
      # internal/version names the build from the same commit date and hash; the
      # check below confirms the binary agrees.
      - name: Name the build
        run: |
          version="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d HEAD).$(git rev-parse HEAD | cut -c1-7)"
          echo "NIGHTLY_VERSION=$version" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean
      - name: Check the version
        run: |
          version=$(dist/mob_linux_amd64_v1/mob --version | awk '{print $NF}')
          if [ "$version" != "$NIGHTLY_VERSION" ]; then
            echo "::error::The binary reports $version, expected $NIGHTLY_VERSION"
            exit 1
          fi
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Publish
        run: |
          if gh release view "$NIGHTLY_VERSION" >/dev/null 2>&1; then
            echo "Release $NIGHTLY_VERSION already exists"
            exit 0
          fi
          gh release create "$NIGHTLY_VERSION" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "Mob $NIGHTLY_VERSION (nightly)" \
            --prerelease --latest=false \
            --generate-notes

  release-please:
    name: Update the release PR
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-please
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # A release PR opened with the default token does not start CI; set
      # RELEASE_PLEASE_TOKEN to a token that can open pull requests so it does.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: main

  stable:
    name: Publish stable
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Build the web UI
        run: bun run build
      # Without HOMEBREW_TAP_TOKEN the cask is built but not pushed to
      # fdkevin0/homebrew-tap.
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Check the version
        run: |
          version=$(dist/mob_linux_amd64_v1/mob --version | awk '{print $NF}')
          if [ "$version" != "${{ needs.release-please.outputs.tag }}" ]; then
            echo "::error::The binary reports $version, expected ${{ needs.release-please.outputs.tag }}"
            exit 1
          fi
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
