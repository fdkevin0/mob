name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: Update the release PR
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-please
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: main

  release:
    name: Publish release
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-${{ github.event.workflow_run.head_sha }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag || github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --os='*' --cpu='*'
      - name: Build archives and npm packages
        id: version
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          version="${TAG:-$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d HEAD).$(git rev-parse --short=7 HEAD)}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          bun run build
          bun scripts/release.ts --version "$version" --npm
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Publish GitHub release
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --clobber
          else
            gh release create "$VERSION" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
              --target "${{ github.event.workflow_run.head_sha }}" \
              --title "Mob $VERSION (nightly)" \
              --prerelease --latest=false \
              --generate-notes
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Publish to npm
        run: |
          npm install -g npm@^11.5.1
          bun scripts/npm/publish.ts
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  desktop:
    name: Desktop app (${{ matrix.os }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Package
        run: bun run build:desktop
        env:
          MOB_BUILD_VERSION: ${{ needs.release.outputs.version }}
      - name: Upload desktop installers
        shell: bash
        run: |
          shopt -s nullglob
          files=(apps/desktop/release/*.{dmg,zip,exe,AppImage,deb})
          gh release upload "$VERSION" "${files[@]}" --clobber
