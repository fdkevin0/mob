name: Release

# Every change to main arrives by pull request. Once CI passes on a commit pushed
# to main (docs/features/releases.md):
# - stable: when a release PR is merged, release-please tags the release and the
#   pipeline publishes the stable release;
# - nightly: otherwise the commit is published as a prerelease tagged {date}.{sha}.
# Both channels also publish the usemob npm package (nightly under the nightly tag,
# stable under latest) and attach desktop installers.
# Older releases stay downloadable for database upgrades (docs/features/releases.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: Update the release PR
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-please
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # A release PR opened with the default token does not start CI; set
      # RELEASE_PLEASE_TOKEN to a token that can open pull requests so it does.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: main

  release:
    name: Publish release
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-${{ github.event.workflow_run.head_sha }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      semver: ${{ steps.version.outputs.semver }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag || github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Every platform's and libc's native packages, so one runner compiles every target.
      - run: bun install --frozen-lockfile --os='*' --cpu='*' --libc='*'
      - name: Build archives and npm packages
        id: version
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          version="${TAG:-$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d HEAD).$(git rev-parse --short=7 HEAD)}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          bun run build
          bun scripts/release.ts --version "$version" --npm
          echo "semver=$(jq -r .version dist/npm/publish.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Publish GitHub release
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --clobber
          else
            gh release create "$VERSION" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
              --target "${{ github.event.workflow_run.head_sha }}" \
              --title "Mob $VERSION (nightly)" \
              --prerelease --latest=false \
              --generate-notes
          fi
      # Trusted publishing needs npm 11.5.1 or newer. The runner's own Node.js
      # lives in a root-owned prefix, so npm is upgraded in setup-node's.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # NPM_TOKEN covers packages without a trusted publisher yet.
      - name: Publish to npm
        run: |
          npm install -g npm@^11.5.1
          bun scripts/npm/publish.ts
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Packages the Electron app around this release's mob binaries for each
  # platform and architecture, attests the installers and attaches them to the
  # GitHub release.
  desktop:
    name: Desktop app (${{ matrix.os }})
    needs: [release-please, release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arches: --x64 --arm64
          - os: macos-latest
            platform: darwin
            arches: --x64 --arm64
          - os: windows-latest
            platform: windows
            arches: --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.release.outputs.version }}
      SEMVER: ${{ needs.release.outputs.semver }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag || github.event.workflow_run.head_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Stage release binaries and package
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            gh release download "$VERSION" -D archive -p "mob_${VERSION}_windows_amd64.zip"
            pwsh -NoProfile -Command "Expand-Archive -LiteralPath 'archive/mob_${VERSION}_windows_amd64.zip' -DestinationPath archive -Force"
            stage_args=(--x64 "archive/mob_${VERSION}_windows_amd64/mob.exe")
          else
            for arch in amd64 arm64; do
              gh release download "$VERSION" -D archive -p "mob_${VERSION}_${{ matrix.platform }}_${arch}.tar.gz"
              tar -xzf "archive/mob_${VERSION}_${{ matrix.platform }}_${arch}.tar.gz" -C archive
            done
            stage_args=(
              --x64 "archive/mob_${VERSION}_${{ matrix.platform }}_amd64/mob"
              --arm64 "archive/mob_${VERSION}_${{ matrix.platform }}_arm64/mob"
            )
          fi
          bun run --cwd apps/desktop build
          bun apps/desktop/scripts/stage.ts "${stage_args[@]}"
          bun run --cwd apps/desktop electron-builder --publish never ${{ matrix.arches }} -c.extraMetadata.version="$SEMVER"
          shopt -s nullglob
          mkdir -p apps/desktop/release/out
          mv apps/desktop/release/*.{dmg,zip,exe,AppImage,deb} apps/desktop/release/out/
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: apps/desktop/release/out/*
      - name: Upload desktop installers
        shell: bash
        run: gh release upload "$VERSION" apps/desktop/release/out/* --clobber

  checksums:
    name: Update SHA256SUMS
    needs: [release, desktop]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Include desktop installers in SHA256SUMS
        run: |
          gh release view "$VERSION" --json assets \
            --jq '.assets[] | select(.name != "SHA256SUMS" and ((.digest // "") | startswith("sha256:"))) | "\(.digest | sub("^sha256:"; ""))  \(.name)"' \
            | LC_ALL=C sort -k2 > SHA256SUMS
          test -s SHA256SUMS
          gh release upload "$VERSION" SHA256SUMS --clobber
