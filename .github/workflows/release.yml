name: Release

# Every change to main arrives by pull request; once CI passes on the merged
# commit, it is published as a release tagged with its version ({date}.{sha},
# docs/adr/0054). Older releases stay downloadable for database upgrades.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}

jobs:
  release:
    name: Publish release
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Build the web UI
        run: bun run build
      # The version comes from the binary itself, so the tag always matches
      # what mob --version reports. Output stays outside the checkout, which
      # must remain clean for the build not to be marked -dirty.
      - name: Build the CLI
        run: |
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "$out/mob" ./cmd/mob
          version=$("$out/mob" --version | awk '{print $NF}')
          if ! [[ "$version" =~ ^[0-9]{8}\.[0-9a-f]{7}$ ]]; then
            echo "::error::Unexpected version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*} arch=${target#*/}
            name="mob_${version}_${os}_${arch}"
            mkdir -p "$out/$name"
            binary=mob
            [ "$os" = windows ] && binary=mob.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "$out/$name/$binary" ./cmd/mob
            cp LICENSE README.md config.example.yaml "$out/$name/"
            if [ "$os" = windows ]; then
              (cd "$out" && zip -qr "$name.zip" "$name")
            else
              tar -C "$out" -czf "$out/$name.tar.gz" "$name"
            fi
          done
          (cd "$out" && sha256sum mob_*.tar.gz mob_*.zip > SHA256SUMS)
      - name: Publish
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists"
            exit 0
          fi
          out="$RUNNER_TEMP/release"
          gh release create "$VERSION" "$out"/mob_*.tar.gz "$out"/mob_*.zip "$out/SHA256SUMS" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "Mob $VERSION" \
            --generate-notes
