name: Release

# Every change to main arrives by pull request. Once CI passes on a commit pushed
# to main (docs/features/releases.md):
# - nightly: the commit is published as a prerelease tagged {date}.{sha};
# - stable: release-please keeps a release PR with the next vX.Y.Z and its
#   changelog up to date. When that PR is merged it tags the release, and
#   scripts/release.ts adds the archives.
# Both channels also publish the usemob npm package: nightly under the nightly
# tag, stable under latest.
# Older releases stay downloadable for database upgrades (docs/features/releases.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  nightly:
    name: Publish nightly
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: nightly-${{ github.event.workflow_run.head_sha }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Every platform's native packages, so one runner compiles every target.
      - run: bun install --frozen-lockfile --os='*' --cpu='*'
      - name: Build the web UI
        run: bun run build
      # The build is named from the commit date and hash; the check below
      # confirms the binary agrees.
      - name: Name the build
        run: |
          version="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d HEAD).$(git rev-parse HEAD | cut -c1-7)"
          echo "NIGHTLY_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build the archives and the npm packages
        run: bun scripts/release.ts --version "$NIGHTLY_VERSION" --npm
      - name: Check the version
        run: |
          version=$(dist/mob_${NIGHTLY_VERSION}_linux_amd64/mob --version | awk '{print $NF}')
          if [ "$version" != "$NIGHTLY_VERSION" ]; then
            echo "::error::The binary reports $version, expected $NIGHTLY_VERSION"
            exit 1
          fi
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Publish
        run: |
          if gh release view "$NIGHTLY_VERSION" >/dev/null 2>&1; then
            echo "Release $NIGHTLY_VERSION already exists"
            exit 0
          fi
          gh release create "$NIGHTLY_VERSION" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "Mob $NIGHTLY_VERSION (nightly)" \
            --prerelease --latest=false \
            --generate-notes
      # Trusted publishing needs npm 11.5.1 or newer. The runner's own Node.js
      # lives in a root-owned prefix, so npm is upgraded in setup-node's.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # NPM_TOKEN covers packages without a trusted publisher yet.
      - name: Publish to npm
        run: |
          npm install -g npm@^11.5.1
          bun scripts/npm/publish.ts
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Packages the Electron app around this nightly's mob for each platform and
  # attaches the installers to the release the nightly job created.
  desktop:
    name: Desktop app (${{ matrix.os }})
    needs: nightly
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Package
        run: bun run build:desktop
      - name: Attach to the nightly
        shell: bash
        run: |
          version="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d HEAD).$(git rev-parse HEAD | cut -c1-7)"
          shopt -s nullglob
          files=(apps/desktop/release/*.{dmg,zip,exe,AppImage,deb})
          gh release upload "$version" "${files[@]}" --clobber

  release-please:
    name: Update the release PR
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-please
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # A release PR opened with the default token does not start CI; set
      # RELEASE_PLEASE_TOKEN to a token that can open pull requests so it does.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: main

  stable:
    name: Publish stable
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --os='*' --cpu='*'
      - name: Build the web UI
        run: bun run build
      - name: Build the archives and the npm packages
        run: bun scripts/release.ts --version "$TAG" --npm
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
      - name: Check the version
        run: |
          version=$(dist/mob_${TAG}_linux_amd64/mob --version | awk '{print $NF}')
          if [ "$version" != "$TAG" ]; then
            echo "::error::The binary reports $version, expected $TAG"
            exit 1
          fi
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      # release-please created the release with its notes; this adds the archives.
      - name: Attach the archives
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
      # Trusted publishing needs npm 11.5.1 or newer. The runner's own Node.js
      # lives in a root-owned prefix, so npm is upgraded in setup-node's.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # NPM_TOKEN covers packages without a trusted publisher yet.
      - name: Publish to npm
        run: |
          npm install -g npm@^11.5.1
          bun scripts/npm/publish.ts
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
