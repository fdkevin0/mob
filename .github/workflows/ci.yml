name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Typecheck and test
        run: |
          bun run test:client
          bun run test:webapp
          bun run test:tui
          bun run test:docs
          bun run test:desktop
      - name: Build
        run: bun run build
      # Workers Builds deploys this; building it here checks the documentation's
      # links and policies on every pull request.
      - name: Build public site
        run: bun run build:web

  core:
    name: TypeScript core and host
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Typecheck and test
        run: bun run test:core

  integration:
    name: Host ↔ AI SDK integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # The host embeds the web UI, so it is built first.
      - run: bun run build
      # The script builds the CLI itself, starts it in demo mode and drives it
      # with the AI SDK client the web UI uses.
      - name: Check chat, commands and approvals end to end
        run: bun run test:integration
      - name: Check DSH plugins and MCP bridge
        run: bun run test:dsh
      - name: Check the runner over the encrypted relay
        run: bun run test:runner

  # scriptc is an experimental native compiler; its report says how much of the
  # host it can compile. It never blocks a merge.
  scriptc:
    name: scriptc coverage (experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: npm install -g scriptc@0.4.3
      - name: Coverage
        run: |
          set +e
          scriptc coverage apps/mob/src/main.ts > scriptc.txt 2>&1
          status=$?
          { echo '## scriptc coverage'; echo; echo '```'; tail -n 200 scriptc.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
