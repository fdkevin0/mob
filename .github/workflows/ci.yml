name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      # The desktop and service code has per-platform files; keep every target compiling.
      - name: go vet (Windows and macOS)
        run: |
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=darwin GOARCH=arm64 go vet ./...
      # Also checks that webapp/src/chat/contracts.ts matches the Go definitions.
      - name: go test
        run: go test -race ./...

  web:
    name: Web UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Typecheck and test
        run: bun run test:webapp
      - name: Build
        run: bun run build

  integration:
    name: Go ↔ AI SDK integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Build the CLI with embedded assets
        run: bun run build:cli
      - name: Check chat, commands and approvals end to end
        run: bun run test:integration

  legacy:
    name: Legacy Telegram/Cloudflare code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Mini App typecheck and tests
        run: bun run test:legacy
      - name: Mini App build
        run: bun run build:legacy
      - name: Worker reference tests
        run: bunx vitest run --config vitest.config.ts
