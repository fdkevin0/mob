name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Typecheck and unit tests
        run: |
          bun run test:core
          bun run test:client
          bun run test:web
          bun run test:tui
          bun run test:docs
          bun run test:desktop
          bun run test:dsh
          bun run test:release
      - name: Build and check public site
        run: |
          bun run build
          bun run build:web
          bun run test:site
      - name: Integration tests
        run: |
          bun run test:integration
          bun run test:runner
