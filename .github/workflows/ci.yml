name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The one check the main ruleset requires, so jobs can be renamed, split or
  # added here without editing the ruleset. scriptc is left out on purpose.
  ci:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # macOS and Windows runners (the desktop release) see Foo.tsx and foo.ts
      # as one file, so './Foo' resolves to the wrong one there.
      - name: Check no paths differ only by case
        run: |
          clash=$(git ls-files | sort -f | uniq -di)
          if [ -n "$clash" ]; then
            echo "::error::These paths differ only by case: $clash"
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Typecheck and unit tests
        run: |
          bun run test:core
          bun run test:client
          bun run test:web
          bun run test:tui
          bun run test:docs
          bun run test:desktop
          bun run test:dsh
          bun run test:release
      # Workers Builds deploys this; building it here checks the documentation's
      # links and policies on every pull request.
      - name: Build and check public site
        run: |
          bun run build
          bun run build:web
          bun run test:site
      # The script builds the CLI itself, starts it in demo mode and drives it
      # with the AI SDK client the web UI uses.
      - name: Integration tests
        run: |
          bun run test:integration
          bun run test:runner
